# https-proxy.compose.yml — nginx HTTPS reverse proxy in front of LibreChat.
#
# Run it through make (which exports DOMAIN for you):   make start-proxy
# Standalone:   DOMAIN=chat.example.org docker compose -f https-proxy.compose.yml up -d
#
# The hostname is NOT baked into the config any more: ud-assistant.conf.template is
# rendered at container start by the nginx entrypoint, substituting ${DOMAIN} only
# (NGINX_ENVSUBST_FILTER), so nginx's own $host/$scheme/... survive untouched.
# DOMAIN's single source of truth is DOMAIN_CLIENT in ../.env — see `make set-domain`.
#
# Requires: ud-assistant.conf.template next to this file, AND Let's Encrypt certs for
# ${DOMAIN}, metrics.${DOMAIN} and feedback.${DOMAIN} already issued into /etc/letsencrypt
# on the host (see HTTPS-SETUP.md step 3, or `make certs`).

services:
  https-proxy:
    image: nginx:1.27-alpine
    container_name: https-proxy
    restart: unless-stopped
    networks:
      - librechat_default
    ports:
      # THIS is the one service that publishes host ports — it's the front door.
      # Bound to all interfaces so VPN users on the UD network can reach it.
      # :80 only answers with a 301 to https:// (see the template) so a bare hostname
      # typed into a browser works instead of being refused.
      - "80:80"
      - "443:443"
    environment:
      # Fails loudly rather than rendering an empty server_name if DOMAIN is unset.
      - DOMAIN=${DOMAIN:?set DOMAIN first — use `make start-proxy`, or export DOMAIN=<your host>}
      # Substitute ONLY ${DOMAIN}; leave nginx's own $$host, $$scheme, $$request_uri alone.
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    volumes:
      - ./ud-assistant.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Mount the host's Let's Encrypt dir read-only so nginx can read the cert.
      # Renewal happens on the host (certbot timer); nginx just reads the files.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      # -k because the cert is valid but the healthcheck hits it by localhost.
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  librechat_default:
    external: true
    name: librechat_default
